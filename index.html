<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <title>Formulário McDonald's </title>
</head>
<body>
    <main class="container">
        <form>
            <h1>Formulário McDonald's</h1> <!-- Título de nível 1 -->
            <div class="input-box"> <!--Aqui na nossa "div" colocamos uma classe-->
                <input type="text" placeholder="Usuário(a)">
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox"> Lembrar Senha
                </label>

                <a href="#">Esqueci a minha senha</a>
            </div>

            <button type="submit" class="login">Login</button>

            <div class="register-link">
                <p>
                    Não tem uma conta? <a href="#">Cadastra-se</a>
                </p>
            </div>
        </form>
    </main>
</body>
</html>
